<!DOCTYPE html><html lang="fr"><head><meta charset="utf-8"><title>Brin Multi Services — Gestion de stock</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>
:root{--bg:#f2f6f6;--card:#fff;--tx:#1d2b2f;--mut:#6b7c80;--pri:#0f9d8a;--pri2:#0b7d6e;--soft:#e3f4f1;--bd:#e4ecec;--red:#e04b4b;--amb:#f0a21c;--sh:0 8px 24px rgba(15,60,55,.08);box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0e1517;--card:#162225;--tx:#e8f1f1;--mut:#8ea3a6;--soft:#14343a;--bd:#233438;--sh:0 8px 24px rgba(0,0,0,.4)}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.45 system-ui,"Segoe UI",Roboto,sans-serif}
html,body{height:100%}
#side{position:fixed;inset:0 auto 0 0;width:290px;background:var(--card);box-shadow:var(--sh);z-index:30;display:flex;flex-direction:column;transition:.25s;overflow:auto}
.prof{background:linear-gradient(160deg,#12ab97,#0b7d6e);color:#fff;text-align:center;padding:28px 16px 20px}

.prof b{font-size:18px;display:block}.prof small{opacity:.85;display:block}
nav a{display:flex;gap:14px;align-items:center;padding:13px 22px;color:var(--tx);cursor:pointer;font-weight:500;border-left:4px solid transparent}
nav a:hover{background:var(--soft)}nav a.on{background:var(--soft);color:var(--pri);border-color:var(--pri)}
nav i{font-style:normal;width:22px;text-align:center}.lab{font-size:11px;letter-spacing:.1em;color:var(--mut);padding:14px 22px 4px}
.out{color:var(--red)}
main{margin-left:290px;padding:24px 28px 60px;max-width:1200px}
.top{display:flex;align-items:center;gap:12px;margin-bottom:20px}.top h1{margin:0;font-size:24px;flex:1}
#burger{display:none}
.btn{border:0;background:var(--pri);color:#fff;padding:10px 16px;border-radius:12px;font:600 14px inherit;cursor:pointer;box-shadow:0 4px 12px rgba(15,157,138,.3)}
.btn:hover{background:var(--pri2)}.btn.g{background:var(--soft);color:var(--pri);box-shadow:none}.btn.r{background:#fde8e8;color:var(--red);box-shadow:none}.btn.s{padding:6px 10px;font-size:12px;border-radius:9px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:16px;margin-bottom:20px}
.card{background:var(--card);border-radius:20px;padding:18px;box-shadow:var(--sh)}
.kpi .ic{width:46px;height:46px;border-radius:14px;background:var(--soft);display:grid;place-items:center;font-size:22px;margin-bottom:10px}
.kpi .v{font-size:24px;font-weight:800;color:var(--pri)}.kpi .l{font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--mut)}
.kpi.w .v{color:var(--amb)}.kpi.w .ic{background:#fdf1d9}
table{width:100%;border-collapse:collapse;font-size:14px}th{text-align:left;color:var(--mut);font-size:12px;text-transform:uppercase;letter-spacing:.05em;padding:10px 8px;border-bottom:1px solid var(--bd)}
td{padding:11px 8px;border-bottom:1px solid var(--bd)}tr:last-child td{border:0}.sc{overflow-x:auto}
.pill{padding:3px 10px;border-radius:99px;font-size:12px;font-weight:700;white-space:nowrap}.ok{background:#dff5ea;color:#16824c}.no{background:#fde8e8;color:var(--red)}.pa{background:#fdf1d9;color:#b97708}
input,select{width:100%;padding:11px 12px;border:1px solid var(--bd);border-radius:12px;background:var(--bg);color:var(--tx);font:inherit}
.bar{height:10px;background:var(--soft);border-radius:9px;overflow:hidden}.bar i{display:block;height:100%;background:linear-gradient(90deg,#12ab97,#0b7d6e)}
.tools{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:14px}.tools input,.tools select{flex:1;min-width:140px}
.qa{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}.qa button{border:0;background:var(--card);box-shadow:var(--sh);border-radius:18px;padding:16px 6px;font:600 13px inherit;color:var(--tx);cursor:pointer}.qa span{display:block;font-size:26px;background:var(--soft);width:52px;height:52px;border-radius:15px;margin:0 auto 8px;line-height:52px}
#mod{position:fixed;inset:0;background:rgba(5,25,25,.55);display:none;align-items:center;justify-content:center;z-index:50;padding:14px}
#mod>div{background:var(--card);border-radius:22px;padding:22px;width:min(560px,100%);max-height:92vh;overflow:auto}
#mod.inv>div{width:min(720px,100%)}
.f{margin-bottom:12px}.f label{font-size:12px;color:var(--mut);display:block;margin-bottom:4px}
.inv-p{background:#fff;color:#111;padding:26px;border-radius:12px;border:1px solid #ddd}
.inv-p table{color:#111}.inv-p th{color:#555}
video{width:100%;border-radius:14px;background:#000}
.h2{font-size:17px;font-weight:700;margin:0 0 12px}
@media(max-width:860px){#side{transform:translateX(-100%)}#side.open{transform:none}main{margin:0;padding:16px 14px 60px}#burger{display:block}.qa{grid-template-columns:repeat(2,1fr)}}
@media print{body *{visibility:hidden}.inv-p,.inv-p *{visibility:visible}.inv-p{position:absolute;inset:0;border:0}}
.gonly{}body.vd .gonly{display:none!important}.th{width:38px;height:38px;border-radius:9px;object-fit:cover;vertical-align:middle;margin-right:8px}.dn{width:110px;height:110px;border-radius:50%;margin:0 auto 8px;background:conic-gradient(var(--pri) calc(var(--p)*1%),var(--soft) 0);display:grid;place-items:center;position:relative}.dn:after{content:'';position:absolute;inset:14px;background:var(--card);border-radius:50%}.dn b{position:relative;z-index:1;font-size:20px}#lg{position:fixed;inset:0;background:linear-gradient(160deg,#12ab97,#0b7d6e);z-index:60;display:none;place-items:center}</style></head><body>
<aside id="side"></aside>
<main><div class="top"><button id="burger" class="btn g" onclick="side.classList.toggle('open')">☰</button><h1 id="ttl"></h1><button class="btn g" onclick="scan()">⌖ Scanner</button></div><div id="v"></div></main>
<div id="lg"></div><div id="mod"></div>
<script>
const $=s=>document.querySelector(s),side=$('#side'),mod=$('#mod'),v=$('#v');
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const F=n=>Math.round(n||0).toLocaleString('fr-FR')+' F',pad=(n,l=4)=>String(n).padStart(l,'0'),today=()=>new Date().toISOString().slice(0,10);
const raw=`HP|EliteBook G3|AMD A8|4 Go|500 Go HDD|90000|S
HP|ProBook 440 G4|i5 7ème gén.|8 Go|256 Go SSD|90000|V

Lenovo|IdeaPad|Intel Celeron|4 Go|256 Go SSD|130000|S
Lenovo|IdeaPad S|i3 10ème gén.|8 Go|256 Go SSD|90000|S
Lenovo|ThinkPad|i5 5ème gén.|8 Go|256 Go SSD|90000|V
ASUS|ZenBook|i7 7ème gén.|16 Go|512 Go SSD|250000|S
ASUS|VivoBook|i5|8 Go|256 Go SSD|110000|V
Acer|Aspire|i3|4 Go|256 Go SSD|85000|S
ASUS|TUF Gaming|i5|16 Go|512 Go SSD|250000|V
Microsoft|Surface Pro 9|Intel Core|16 Go|256 Go SSD|250000|V
Apple|MacBook Pro|Intel Core i5|8 Go|256 Go SSD|80000|S
HP|Raizen 4|AMD Ryzen 4|8 Go|256 Go SSD|100000|V
Google|Pixel A|Google Tensor|8 Go|128 Go|350000|V
Samsung|S21 Ultra|S21 Ultra|12 Go|256 Go SSD|140000|V`;
const sv=[[22,350000,'Elie Kouakou',[100000]],[17,160000,'Christian',[100000,50000]],[21,260000,'Sori',[]],[7,180000,'Mme Koné',[60000]],[14,240000,'Yoro',[50000,40000]],[5,130000,'Major Dibahi',[40000]],[2,180000,'Major Mambo',[50000]],[3,180000,'Max',[60000,60000,60000]],[19,150000,'Didier',[]],[24,115000,'Romaric Elie',[85000,15000]],[6,90000,'Sori',[90000]],[25,420000,'Mme Pasteur',[200000,100000]]];
const seed=()=>({prods:raw.split('\n').map((l,i)=>{const a=l.split('|');return{id:i+1,type:'produit',m:a[0],mod:a[1],cpu:a[2],ram:a[3],sto:a[4],pa:+a[5],pv:Math.round(a[5]*1.4/5000)*5000,qty:a[6]=='S'?1:0,min:1,four:''}}),
 sales:sv.map((s,i)=>({id:i+1,pid:s[0],pv:s[1],cl:s[2],tel:'',d:'2025-01-31',pays:s[3].map(x=>({m:x,d:'2025-01-31'}))})),exp:[],sup:[],cli:{},users:[{n:'Gérant',r:'g',pin:'1234'}],shop:'M. Brin MULTI SERVICES',own:'Brin Kouakou Manzan Eugene',mail:'brinmanzan@gmail.com'});
let S;try{S=JSON.parse(localStorage.getItem('bms'))}catch(e){}S=S||seed();
S.users=S.users||[{n:'Gérant',r:'g',pin:'1234'}];let DB,tq,me=null,cur='dash';const G=()=>!me||me.r=='g';
const save=()=>{S.v=Date.now();try{localStorage.setItem('bms',JSON.stringify(S))}catch(e){}clearTimeout(tq);tq=setTimeout(()=>{DB&&DB.set({v:S.v,s:JSON.stringify(S,(k,x)=>typeof x=='string'&&x.startsWith('data:')?undefined:x)}).catch(()=>{})},800)};
const P=id=>S.prods.find(p=>p.id==id),code=p=>'INV-'+pad(p.id),name=p=>p.m+' '+p.mod;
const paid=s=>s.pays.reduce((a,b)=>a+b.m,0),st=s=>{const p=paid(s);return p>=s.pv?['Soldé','ok']:p>0?['Partiel','pa']:['En attente','no']};
// Code128-B
const C=("212222,222122,222221,121223,121322,131222,122213,122312,132212,221213,221312,231212,112232,122132,122231,113222,123122,123221,223211,221132,221231,213212,223112,312131,311222,321122,321221,312212,322112,322211,212123,212321,232121,111323,131123,131321,112313,132113,132311,211313,231113,231311,112133,112331,132131,113123,113321,133121,313121,211331,231131,213113,213311,213131,311123,311321,331121,312113,312311,332111,314111,221411,431111,111224,111422,121124,121421,141122,141221,112214,112412,122114,122411,142112,142211,241211,221114,413111,241112,134111,111242,121142,121241,114212,124112,124211,411212,421112,421211,212141,214121,412121,111143,111341,131141,114113,114311,411113,411311,113141,114131,311141,411131,211412,211214,211232,2331112").split(',');
function bc(t,h=60){let v=[104],s=104;[...t].forEach((c,i)=>{const k=c.charCodeAt(0)-32;v.push(k);s+=k*(i+1)});v.push(s%103,106);let x=10,r='';v.forEach(k=>{[...C[k]].forEach((w,i)=>{if(i%2==0)r+=`<rect x="${x}" y="0" width="${w}" height="${h}"/>`;x+=+w})});return`<svg viewBox="0 0 ${x+10} ${h+16}" style="max-width:240px;width:100%;background:#fff;fill:#000"><rect width="100%" height="100%" fill="#fff"/>${r}<text x="${(x+10)/2}" y="${h+12}" font-size="11" text-anchor="middle" fill="#000" font-family="monospace">${t}</text></svg>`}
// modal helpers
const close=()=>{mod.style.display='none';stopCam()};const open=(h,c='')=>{mod.className=c;mod.innerHTML='<div>'+h+'</div>';mod.style.display='flex'};
mod.onclick=e=>{if(e.target==mod)close()};
function form(title,fl,cb,ok='Enregistrer'){open(`<h3 class="h2">${title}</h3>`+fl.map(f=>`<div class="f"><label>${f.l}</label>${f.o?`<select id="f_${f.k}">${f.o.map(o=>`<option value="${esc(Array.isArray(o)?o[0]:o)}" ${(Array.isArray(o)?o[0]:o)==f.v?'selected':''}>${esc(Array.isArray(o)?o[1]:o)}</option>`).join('')}</select>`:`<input id="f_${f.k}" type="${f.t||'text'}" value="${esc(f.v)}">`}</div>`).join('')+`<div style="display:flex;gap:8px;justify-content:flex-end"><button class="btn g" onclick="close()">Annuler</button><button class="btn" id="ok">${ok}</button></div>`);
 $('#ok').onclick=()=>{const o={};fl.forEach(f=>{const e=$('#f_'+f.k);o[f.k]=f.t=='number'?+e.value:e.value.trim()});if(cb(o)!==false){save();close();go(cur)}}}
const pf=(p={})=>[{k:'type',l:'Type',o:['produit','service'],v:p.type},{k:'m',l:'Marque / Catégorie',v:p.m},{k:'mod',l:'Modèle / Désignation',v:p.mod},{k:'cpu',l:'Processeur',v:p.cpu},{k:'ram',l:'RAM',v:p.ram},{k:'sto',l:'Stockage',v:p.sto},{k:'pa',l:'Prix d’achat (FCFA)',t:'number',v:p.pa||0},{k:'pv',l:'Prix de vente (FCFA)',t:'number',v:p.pv||0},{k:'qty',l:'Quantité en stock',t:'number',v:p.qty??1},{k:'min',l:'Seuil d’alerte',t:'number',v:p.min??1},{k:'four',l:'Fournisseur',o:['',...S.sup.map(s=>s.n)],v:p.four}];
function addProd(){form('Ajouter un produit ou service',pf(),o=>{if(!o.mod)return false;S.prods.push({id:Math.max(0,...S.prods.map(p=>p.id))+1,...o})})}
function editProd(id){const p=P(id);form('Modifier — '+code(p),pf(p),o=>{Object.assign(p,o)})}
function adjust(id){const p=P(id);form('Ajuster le stock — '+name(p),[{k:'qty',l:'Nouvelle quantité',t:'number',v:p.qty}],o=>{p.qty=o.qty})}
function newSale(pid){const av=S.prods.filter(p=>p.qty>0||p.type=='service');if(!av.length)return alert('Aucun article en stock.');pid=pid||av[0].id;
 form('Nouvelle vente',[{k:'pid',l:'Article',o:av.map(p=>[p.id,code(p)+' · '+name(p)+' · '+p.cpu]),v:pid},{k:'cl',l:'Client',v:''},{k:'tel',l:'Contact',v:''},{k:'pv',l:'Prix de vente (FCFA)',t:'number',v:P(pid).pv},{k:'v1',l:'1er versement (FCFA)',t:'number',v:0}],o=>{if(!o.cl)return false;const p=P(o.pid);if(p.type=='produit')p.qty--;const s={id:Math.max(0,...S.sales.map(x=>x.id))+1,pid:p.id,pv:o.pv,cl:o.cl,tel:o.tel,d:today(),pays:o.v1>0?[{m:o.v1,d:today()}]:[]};S.sales.push(s);setTimeout(()=>invoice(s.id),50)},'Vendre');
 $('#f_pid').onchange=e=>$('#f_pv').value=P(e.target.value).pv}
function pay(id){const s=S.sales.find(x=>x.id==id);form('Versement — '+s.cl+' (reste '+F(s.pv-paid(s))+')',[{k:'m',l:'Montant (FCFA)',t:'number',v:s.pv-paid(s)}],o=>{if(o.m<=0)return false;s.pays.push({m:o.m,d:today()})})}
function invoice(id){const s=S.sales.find(x=>x.id==id),p=P(s.pid),pd=paid(s);
 open(`<div class="inv-p"><div style="display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap"><div><b style="font-size:20px;color:#0b7d6e">${esc(S.shop)}</b><br>${esc(S.own)}<br>${esc(S.mail)}</div><div style="text-align:right"><b style="font-size:22px">FACTURE</b><br>N° F-${s.d.slice(0,4)}-${pad(s.id)}<br>Date : ${s.d}</div></div><hr><p><b>Client :</b> ${esc(s.cl)} ${esc(s.tel)}</p><div class="sc"><table><tr><th>Désignation</th><th>Réf.</th><th>Qté</th><th style="text-align:right">Montant</th></tr><tr><td>${esc(name(p))}<br><small>${esc([p.cpu,p.ram,p.sto].filter(Boolean).join(' · '))}</small></td><td>${code(p)}</td><td>1</td><td style="text-align:right">${F(s.pv)}</td></tr></table></div>
 <p style="text-align:right;font-size:16px">Total : <b>${F(s.pv)}</b><br>Versé : ${F(pd)}<br><b style="color:${s.pv>pd?'#c0392b':'#16824c'}">Reste à payer : ${F(s.pv-pd)}</b></p>${s.pays.length?'<small>Versements : '+s.pays.map(x=>x.d+' → '+F(x.m)).join(' | ')+'</small>':''}<div style="text-align:center;margin-top:14px">${bc(code(p),40)}</div><p style="text-align:center;color:#666"><small>Merci pour votre confiance.</small></p></div><div style="display:flex;gap:8px;justify-content:flex-end;margin-top:12px"><button class="btn g" onclick="close();go(cur)">Fermer</button><button class="btn" onclick="print()">🖨 Imprimer / PDF</button></div>`,'inv')}
function label(id){const p=P(id);open(`<h3 class="h2">Étiquette code-barres</h3><div style="text-align:center"><b>${esc(name(p))}</b><br><small>${esc(p.cpu)} · ${esc(p.ram)} · ${esc(p.sto)}</small><br><b style="color:#0f9d8a">${F(p.pv)}</b><div class="inv-p" style="margin:10px 0">${bc(code(p))}</div></div><div style="text-align:right"><button class="btn" onclick="print()">🖨 Imprimer</button></div>`)}
// scanner
let cam,tm;function stopCam(){clearInterval(tm);cam&&cam.getTracks().forEach(t=>t.stop());cam=null}
function found(c){c=c.trim().toUpperCase();const p=S.prods.find(p=>code(p)==c);if(!p){$('#sr').innerHTML='<p style="color:var(--red)">Code « '+esc(c)+' » introuvable.</p>';return}stopCam();
 $('#sr').innerHTML=`<div class="card"><b>${esc(name(p))}</b> <span class="pill ${p.qty>0?'ok':'no'}">${p.qty>0?'En stock ('+p.qty+')':'Vendu / épuisé'}</span><br><small>${esc(p.cpu)} · ${esc(p.ram)} · ${esc(p.sto)}</small><p><span class="gonly">Achat ${F(p.pa)} · </span>Vente <b>${F(p.pv)}</b></p><button class="btn" ${p.qty>0?'':'disabled'} onclick="close();newSale(${p.id})">Vendre</button> <button class="btn g" onclick="close();adjust(${p.id})">Ajuster</button></div>`}
async function scan(){open(`<h3 class="h2">Scanner un article</h3><video id="cam" playsinline muted style="display:none"></video><div class="f" style="margin-top:10px"><label>Scanner USB / saisie du code (ex : INV-0004) puis Entrée</label><input id="sc" placeholder="INV-0000" autofocus></div><div id="sr"></div>`);
 $('#sc').onkeydown=e=>{if(e.key=='Enter')found(e.target.value)};
 if('BarcodeDetector' in window&&navigator.mediaDevices){try{cam=await navigator.mediaDevices.getUserMedia({video:{facingMode:'environment'}});const c=$('#cam');c.style.display='block';c.srcObject=cam;await c.play();const d=new BarcodeDetector();tm=setInterval(async()=>{try{const r=await d.detect(c);if(r.length)found(r[0].rawValue)}catch(e){}},400)}catch(e){}}}
// views
const stock=()=>S.prods.filter(p=>p.type=='produit'&&p.qty>0),val=l=>l.reduce((a,p)=>a+p.pa*p.qty,0);
const tot=()=>{const ca=S.sales.reduce((a,s)=>a+s.pv,0),enc=S.sales.reduce((a,s)=>a+paid(s),0),mg=S.sales.reduce((a,s)=>a+s.pv-(P(s.pid)?.pa||0),0);return{ca,enc,mg,rest:ca-enc}};
const kpi=(i,v,l,w,g)=>`<div class="card kpi ${w?'w':''} ${g?'gonly':''}"><div class="ic">${i}</div><div class="v">${v}</div><div class="l">${l}</div></div>`;
const brands=()=>{const m={};S.prods.filter(p=>p.type=='produit').forEach(p=>{const b=m[p.m]=m[p.m]||{n:0,v:0,ca:0,mg:0};b.n++;if(p.qty>0)b.v+=p.qty});S.sales.forEach(s=>{const p=P(s.pid);if(!p)return;const b=m[p.m];b.ca+=s.pv;b.mg+=s.pv-p.pa});return Object.entries(m).sort((a,b)=>b[1].ca-a[1].ca)};
const brandHTML=()=>{const b=brands(),mx=Math.max(1,...b.map(x=>x[1].ca));return b.map(([k,x])=>`<div style="margin-bottom:12px"><div style="display:flex;justify-content:space-between"><b>${esc(k)}</b><small>${x.n} réf. · ${x.v} en stock · CA ${F(x.ca)} · marge ${F(x.mg)} (${x.ca?Math.round(x.mg/x.ca*100):0} %)</small></div><div class="bar"><i style="width:${x.ca/mx*100}%"></i></div></div>`).join('')};
function charts(){const m={};S.sales.forEach(s=>{const k=s.d.slice(0,7);m[k]=(m[k]||0)+s.pv});const ks=Object.keys(m).sort(),mx=Math.max(1,...Object.values(m)),sk=stock().length,all=S.prods.filter(p=>p.type=='produit').length,t=tot(),pc=t.ca?Math.round(t.enc/t.ca*100):0,ps=all?Math.round(sk/all*100):0;return`<div class="grid" style="grid-template-columns:repeat(auto-fit,minmax(260px,1fr))"><div class="card"><h3 class="h2">Ventes par mois</h3><div style="display:flex;align-items:flex-end;gap:10px;height:160px">${ks.map(k=>`<div style="flex:1;text-align:center;font-size:11px"><div style="height:${m[k]/mx*110}px;background:linear-gradient(#12ab97,#0b7d6e);border-radius:8px 8px 0 0"></div>${k}<br>${Math.round(m[k]/1000)}k</div>`).join('')}</div></div><div class="card" style="text-align:center"><h3 class="h2">Stock disponible</h3><div class="dn" style="--p:${ps}"><b>${ps} %</b></div><small>${sk} en stock sur ${all}</small></div><div class="card" style="text-align:center"><h3 class="h2">Encaissement</h3><div class="dn" style="--p:${pc}"><b>${pc} %</b></div><small>${F(t.enc)} sur ${F(t.ca)}</small></div></div>`}
const MM=()=>M.filter(m=>G()||['dash','add','ventes','stock','clients'].includes(m[0]));
function login(){const d=$('#lg');d.style.display='grid';d.innerHTML=`<div class="card" style="width:min(380px,92%);text-align:center"><div class="av" style="background:var(--pri);color:#fff">${esc(S.shop.replace(/^M\.\s*/,'')[0])}</div><h3 class="h2">${esc(S.shop)}</h3><div class="f"><select id="lu">${S.users.map((u,i)=>`<option value="${i}">${esc(u.n)} (${u.r=='g'?'Gérant':'Vendeur'})</option>`).join('')}</select></div><div class="f"><input id="lp" type="password" inputmode="numeric" placeholder="Code PIN" onkeydown="if(event.key=='Enter')lg2()"></div><button class="btn" style="width:100%" onclick="lg2()">Se connecter</button><small id="le" style="color:var(--red)"></small><p><small>PIN initial du gérant : 1234 (à changer dans Profil)</small></p></div>`}
function lg2(){const u=S.users[$('#lu').value];if(u.pin!=$('#lp').value){$('#le').textContent='PIN incorrect';return}me=u;$('#lg').style.display='none';document.body.classList.toggle('vd',u.r!='g');go('dash')}
function addUser(){form('Nouvel utilisateur',[{k:'n',l:'Nom',v:''},{k:'r',l:'Rôle',o:[['v','Vendeur'],['g','Gérant']],v:'v'},{k:'pin',l:'Code PIN (4 chiffres ou plus)',v:''}],o=>{if(!o.n||o.pin.length<4)return false;S.users.push(o)})}
function photo(id){open(`<h3 class="h2">Photo du produit</h3><input id="ph" type="file" accept="image/*"><div style="text-align:right;margin-top:12px"><button class="btn g" onclick="close()">Fermer</button></div>`);$('#ph').onchange=async e=>{const f=e.target.files[0];if(!f)return;const im=await createImageBitmap(f),k=Math.min(1,320/Math.max(im.width,im.height)),c=document.createElement('canvas');c.width=im.width*k;c.height=im.height*k;c.getContext('2d').drawImage(im,0,0,c.width,c.height);const b=await new Promise(r=>c.toBlob(r,'image/jpeg',.75));let u=null;try{const A=await claude.use('assets');if(A)u=(await A.upload(b)).url}catch(x){}P(id).img=u||c.toDataURL('image/jpeg',.75);save();close();go(cur)}}
const V={
dash(){const t=tot(),sk=stock(),low=S.prods.filter(p=>p.type=='produit'&&p.qty<=p.min&&p.qty>0);return`<div class="grid">${kpi('👜',F(val(sk)),'Valeur du stock')+kpi('🛒',F(t.ca),'Chiffre d’affaires')+kpi('✅',F(t.enc),'Déjà encaissé')+kpi('⏳',F(t.rest),'Reste à encaisser',1)+kpi('📈',F(t.mg),'Marges totales',0,1)+kpi('📦',sk.length+' / '+S.prods.filter(p=>p.type=='produit').length,'En stock / Total',1)}</div>
<div class="qa" style="margin-bottom:20px"><button onclick="newSale()"><span>🛒</span>Vendre</button><button onclick="scan()"><span>⌖</span>Scanner</button><button onclick="addProd()"><span>＋</span>Ajouter</button><button onclick="go('stock')"><span>⇅</span>Ajuster</button></div>
${charts()}<div class="card gonly" style="margin-bottom:20px"><h3 class="h2">Analyse par marque</h3>${brandHTML()}</div>
<div class="card sc"><h3 class="h2">Dernières ventes</h3><table><tr><th>Facture</th><th>Client</th><th>Article</th><th>Montant</th><th>Statut</th></tr>${S.sales.slice(-6).reverse().map(s=>`<tr><td>F-${pad(s.id)}</td><td>${esc(s.cl)}</td><td>${esc(name(P(s.pid)||{m:'—',mod:''}))}</td><td>${F(s.pv)}</td><td><span class="pill ${st(s)[1]}">${st(s)[0]}</span></td></tr>`).join('')}</table></div>${low.length?`<div class="card" style="margin-top:20px"><h3 class="h2">⚠ Stock bas</h3>${low.map(p=>esc(name(p))+' ('+p.qty+')').join(' · ')}</div>`:''}`},
add(){setTimeout(addProd,0);return'<div class="card">Formulaire d’ajout ouvert. Vous pouvez ajouter un produit (ordinateur, téléphone…) ou un service (réparation, installation…).</div>'},
achats(){const l=S.prods.filter(p=>p.type=='produit');return`<div class="tools"><button class="btn" onclick="addProd()">＋ Nouvel achat</button></div><div class="card sc"><table><tr><th>Réf.</th><th>Article</th><th>Fournisseur</th><th>Prix d’achat</th></tr>${l.map(p=>`<tr><td>${code(p)}</td><td>${esc(name(p))}</td><td>${esc(p.four||'—')}</td><td>${F(p.pa)}</td></tr>`).join('')}<tr><td colspan="3"><b>Total achats</b></td><td><b>${F(l.reduce((a,p)=>a+p.pa,0))}</b></td></tr></table></div>`},
ventes(){return`<div class="tools"><button class="btn" onclick="newSale()">＋ Nouvelle vente</button></div><div class="card sc"><table><tr><th>Facture</th><th>Client</th><th>Article</th><th>Prix</th><th>Reçu</th><th>Reste</th><th class="gonly">Marge</th><th></th></tr>${S.sales.slice().reverse().map(s=>{const p=P(s.pid)||{pa:0};return`<tr><td>F-${pad(s.id)}</td><td>${esc(s.cl)}</td><td>${esc(name(P(s.pid)||{m:'—',mod:''}))}</td><td>${F(s.pv)}</td><td>${F(paid(s))}</td><td><span class="pill ${st(s)[1]}">${F(s.pv-paid(s))}</span></td><td class="gonly">${F(s.pv-p.pa)}</td><td style="white-space:nowrap">${s.pv>paid(s)?`<button class="btn s g" onclick="pay(${s.id})">+ Versement</button> `:''}<button class="btn s" onclick="invoice(${s.id})">Facture</button></td></tr>`}).join('')}</table></div>`},
autres(){const i=S.exp.filter(e=>e.t=='Revenu').reduce((a,e)=>a+e.m,0),o=S.exp.filter(e=>e.t=='Dépense').reduce((a,e)=>a+e.m,0);return`<div class="grid">${kpi('⬆',F(i),'Autres revenus')+kpi('⬇',F(o),'Autres dépenses',1)+kpi('＝',F(i-o),'Solde')}</div><div class="tools"><button class="btn" onclick="addExp()">＋ Ajouter</button></div><div class="card sc"><table><tr><th>Date</th><th>Type</th><th>Libellé</th><th>Montant</th><th></th></tr>${S.exp.map((e,k)=>`<tr><td>${e.d}</td><td><span class="pill ${e.t=='Revenu'?'ok':'no'}">${e.t}</span></td><td>${esc(e.l)}</td><td>${F(e.m)}</td><td><button class="btn s r" onclick="S.exp.splice(${k},1);save();go(cur)">✕</button></td></tr>`).join('')||'<tr><td colspan="5">Aucune écriture. Ex : transport, loyer, réparation…</td></tr>'}</table></div>`},
stock(){return`<div class="tools"><input id="q" placeholder="Rechercher (marque, modèle, code…)" oninput="flt()"><select id="fs" onchange="flt()"><option value="">Tous</option><option value="1">En stock</option><option value="0">Vendus</option></select><button class="btn" onclick="addProd()">＋ Produit</button></div><div class="card sc"><table id="tb"></table></div>`},
rapports(){const t=tot(),i=S.exp.filter(e=>e.t=='Revenu').reduce((a,e)=>a+e.m,0),o=S.exp.filter(e=>e.t=='Dépense').reduce((a,e)=>a+e.m,0);return`<div class="grid">${kpi('🛒',F(t.ca),'Ventes')+kpi('📈',F(t.mg),'Marge brute')+kpi('🧾',F(o),'Dépenses',1)+kpi('💰',F(t.mg+i-o),'Résultat net')}</div><div class="card" style="margin-bottom:20px"><h3 class="h2">Performance par marque</h3>${brandHTML()}</div><div class="tools"><button class="btn g" onclick="csv()">⬇ Exporter le stock (CSV)</button></div>`},
clients(){const m={};S.sales.forEach(s=>{const c=m[s.cl]=m[s.cl]||{pv:0,p:0,n:0,tel:''};c.pv+=s.pv;c.p+=paid(s);c.n++;c.tel=s.tel||c.tel});return`<div class="card sc"><table><tr><th>Client</th><th>Achats</th><th>Total</th><th>Payé</th><th>Reste</th><th>Statut</th></tr>${Object.entries(m).map(([k,c])=>{const r=c.pv-c.p;return`<tr><td><b>${esc(k)}</b><br><small>${esc(c.tel)}</small></td><td>${c.n}</td><td>${F(c.pv)}</td><td>${F(c.p)}</td><td>${F(r)}</td><td><span class="pill ${r<=0?'ok':c.p>0?'pa':'no'}">${r<=0?'Soldé':c.p>0?'Partiel':'En attente'}</span></td></tr>`}).join('')}</table></div>`},
fournisseurs(){return`<div class="tools"><button class="btn" onclick="addSup()">＋ Fournisseur</button></div><div class="card sc"><table><tr><th>Nom</th><th>Contact</th><th>Adresse</th><th></th></tr>${S.sup.map((s,k)=>`<tr><td><b>${esc(s.n)}</b></td><td>${esc(s.t)}</td><td>${esc(s.a)}</td><td><button class="btn s r" onclick="S.sup.splice(${k},1);save();go(cur)">✕</button></td></tr>`).join('')||'<tr><td colspan="4">Aucun fournisseur enregistré.</td></tr>'}</table></div>`},
profil(){return`<div class="card" style="max-width:480px"><div class="f"><label>Nom de l’entreprise</label><input id="p1" value="${esc(S.shop)}"></div><div class="f"><label>Gérant</label><input id="p2" value="${esc(S.own)}"></div><div class="f"><label>E-mail</label><input id="p3" value="${esc(S.mail)}"></div><button class="btn" onclick="S.shop=p1.value;S.own=p2.value;S.mail=p3.value;save();go('profil')">Enregistrer</button> <button class="btn r" onclick="if(confirm('Réinitialiser toutes les données ?')){S=seed();save();go('dash')}">Réinitialiser</button></div><div class="card" style="max-width:480px;margin-top:16px"><h3 class="h2">Utilisateurs</h3>${S.users.map((u,k)=>`<div style="display:flex;justify-content:space-between;align-items:center;padding:6px 0"><span>${esc(u.n)} — ${u.r=='g'?'Gérant':'Vendeur'}</span>${k?`<button class="btn s r" onclick="S.users.splice(${k},1);save();go('profil')">✕</button>`:''}</div>`).join('')}<button class="btn g" onclick="addUser()">＋ Ajouter un utilisateur</button></div>`}};
function addExp(){form('Autre dépense ou revenu',[{k:'t',l:'Type',o:['Dépense','Revenu'],v:'Dépense'},{k:'l',l:'Libellé',v:''},{k:'m',l:'Montant (FCFA)',t:'number',v:0}],o=>{if(!o.l||o.m<=0)return false;S.exp.push({...o,d:today()})})}
function addSup(){form('Nouveau fournisseur',[{k:'n',l:'Nom',v:''},{k:'t',l:'Téléphone',v:''},{k:'a',l:'Adresse',v:''}],o=>{if(!o.n)return false;S.sup.push(o)})}
function flt(){const q=$('#q').value.toLowerCase(),f=$('#fs').value;$('#tb').innerHTML='<tr><th>Code</th><th>Article</th><th>Caractéristiques</th><th class="gonly">Achat</th><th>Vente</th><th>Qté</th><th>Statut</th><th></th></tr>'+S.prods.filter(p=>(code(p)+name(p)+p.cpu).toLowerCase().includes(q)&&(f==''||(f=='1')==(p.qty>0))).map(p=>`<tr><td>${code(p)}</td><td>${p.img?`<img class="th" src="${p.img}">`:''}<b>${esc(name(p))}</b></td><td>${esc([p.cpu,p.ram,p.sto].filter(Boolean).join(' · '))}</td><td class="gonly">${F(p.pa)}</td><td>${F(p.pv)}</td><td>${p.qty}</td><td><span class="pill ${p.qty>0?'ok':'no'}">${p.qty>0?'En stock':'Vendu'}</span></td><td style="white-space:nowrap"><button class="btn s g" onclick="photo(${p.id})">📷</button> <button class="btn s g" onclick="label(${p.id})">▮▮ Code</button> <button class="btn s g" onclick="adjust(${p.id})">⇅</button> <button class="btn s g" onclick="editProd(${p.id})">✎</button></td></tr>`).join('')}
function csv(){claude.use('downloads').then(D=>{const r=S.prods.map(p=>[code(p),p.m,p.mod,p.cpu,p.ram,p.sto,p.pa,p.pv,p.qty].join(';'));D&&D.save({filename:'stock.csv',data:'Code;Marque;Modèle;CPU;RAM;Stockage;Achat;Vente;Qté\n'+r.join('\n')})});return;const r=[['Code','Marque','Modèle','CPU','RAM','Stockage','Achat','Vente','Qté']].concat(S.prods.map(p=>[code(p),p.m,p.mod,p.cpu,p.ram,p.sto,p.pa,p.pv,p.qty]));const a=document.createElement('a');a.href='data:text/csv;charset=utf-8,\ufeff'+encodeURIComponent(r.map(x=>x.join(';')).join('\n'));a.download='stock.csv';a.click()}
const M=[['dash','▦','Tableau de bord'],['add','🏷','Ajouter produit ou service'],['achats','🧾','Achats'],['ventes','🛒','Ventes'],['autres','👛','Autres Dépenses et Revenus'],['stock','📦','Stock'],['rapports','📊','Rapports'],['clients','👥','Clients'],['fournisseurs','🏢','Fournisseurs'],['profil','👤','Profil']];
function go(k){cur=k;side.classList.remove('open');side.innerHTML=`<div class="prof"><div class="av">${esc(S.shop.replace(/^M\.\s*/,'')[0])}</div><b>${esc(S.shop)}</b><small>${esc(S.own)}</small><small>${esc(S.mail)}</small></div><nav>${MM().map(m=>`<a class="${m[0]==k?'on':''}" onclick="go('${m[0]}')"><i>${m[1]}</i>${m[2]}</a>`).join('')}<div class="lab">PARAMÈTRES</div><a class="out" onclick="me=null;document.body.classList.remove('vd');login()"><i>⎋</i>Déconnexion</a></nav>`;
 $('#ttl').textContent=M.find(m=>m[0]==k)[2];v.innerHTML=V[k]();if(k=='stock')flt()}
(async()=>{try{const d=await claude.use('db');if(!d)return;DB=d.doc('state/main');DB.onSnapshot(s=>{if(!s.exists){save();return}const x=s.data();if(x.v>(S.v||0)){const loc={};S.prods.forEach(p=>{if(p.img&&p.img.startsWith('data:'))loc[p.id]=p.img});S=JSON.parse(x.s);S.prods.forEach(p=>{if(loc[p.id]&&!p.img)p.img=loc[p.id]});try{localStorage.setItem('bms',JSON.stringify(S))}catch(e){}if(me){me=S.users.find(u=>u.n==me.n)||me;go(cur)}}})}catch(e){}})();
login();
</script></body></html>
